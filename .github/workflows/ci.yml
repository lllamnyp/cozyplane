name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '/vendor/'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: codegen drift
        run: |
          make generate
          if ! git diff --exit-code; then
            echo "Generated code is stale — run 'make generate' and commit the result." >&2
            exit 1
          fi

  # kpr/ is a separate module, so the root `go vet ./...` and `go test ./...`
  # above never reach it — its packages need their own job or they go unchecked.
  # (gofmt above does cover them: it lists files repo-wide.)
  kpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kpr/go.mod
          cache-dependency-path: kpr/go.sum

      - name: go vet
        run: go -C kpr vet ./...

      - name: go test
        run: go -C kpr test ./...

      # The image cross-compiles for arm64 (release.yml); catch a break here,
      # where the failure is one line, rather than in the release build.
      - name: cross-compile arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go -C kpr build -o /dev/null .

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          for c in chart/*/; do helm lint "$c"; done

      # The charts are served straight from git by a PackageSource that declares
      # no `libraries` (packages/packagesources/, docs/packaging.md), so each one
      # must render standalone — a cozy-lib or any other chart dependency would
      # break the install. Render exactly as the PackageSource does, values files
      # and all.
      - name: helm template (standalone, library-free)
        run: |
          helm template cozyplane chart/cozyplane \
            -f chart/cozyplane/values.yaml -f chart/cozyplane/values-talos.yaml >/dev/null
          helm template cozyplane-kpr chart/cozyplane-kpr \
            -f chart/cozyplane-kpr/values.yaml -f chart/cozyplane-kpr/values-talos.yaml >/dev/null
          helm template cozyplane-apiserver chart/cozyplane-apiserver \
            -f chart/cozyplane-apiserver/values.yaml >/dev/null
          helm template cozyplane-cilium-crds chart/cozyplane-cilium-crds >/dev/null

      # The agent and the aggregated apiserver are two binaries in ONE image, so
      # a split pin quietly ships two different builds of the same tree.
      - name: image pins agree
        run: |
          a=$(helm show values chart/cozyplane | yq '.image')
          b=$(helm show values chart/cozyplane-apiserver | yq '.image')
          [ "$a" = "$b" ] || { echo "pin drift: $a != $b" >&2; exit 1; }

  # The compiled eBPF object (datapath/overlay_bpfel.*) is committed and embedded
  # via go:embed. Regenerate it from the runner's kernel BTF and flag drift. The
  # exact object bytes are clang-version sensitive, so this is informational
  # (non-blocking): what it reliably guards is the generated Go bindings
  # (map/struct layout), which must match bpf/overlay.c.
  ebpf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install clang + libbpf headers
        # overlay.c includes <bpf/bpf_helpers.h> from libbpf-dev (/usr/include/bpf).
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - name: install bpftool (static)
        # noble has no installable `bpftool`, and linux-tools-generic ships a
        # wrapper that can't find a binary for the runner's -azure kernel. Use
        # the kernel-independent static build from the libbpf release instead.
        run: |
          curl -sSL https://github.com/libbpf/bpftool/releases/download/v7.5.0/bpftool-v7.5.0-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/bpftool
          bpftool version
      - name: generate vmlinux.h from runner BTF
        run: |
          test -f /sys/kernel/btf/vmlinux
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
      - name: go generate ./datapath
        run: go generate ./datapath
      - name: flag bindings drift
        run: |
          if ! git diff --exit-code datapath/overlay_bpfel.go; then
            echo "::warning::eBPF Go bindings differ from bpf/overlay.c — run 'go generate ./datapath' and commit."
          fi
