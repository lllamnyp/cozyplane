# Authorization for VPC sharing (see docs/control-plane.md §6).
#
# A VPCBinding lives in the *consumer* namespace and grants its pods the right to
# attach to the VPC named in spec.vpcRef. Creating one is gated by TWO checks,
# both of which must be satisfied by the same principal (the VPC owner):
#
#   1. Standard RBAC: `create vpcbindings` in the target (consumer) namespace.
#      Enforced by the normal authorization chain — see the owner ClusterRole
#      below, RoleBound into the namespaces an owner may bind into.
#   2. The `export` verb on the referenced VPC, checked by the
#      ValidatingAdmissionPolicy below via a SubjectAccessReview against the
#      request's user. This is the load-bearing escalation gate: a tenant
#      trivially holds `create vpcbindings` in its own namespace, so without the
#      export check it could bind to any VPC and attach. `export` is what stops
#      a subtenant binding to a VPC it does not own.
#
# This is the intra-domain primitive only: it works when one principal holds
# authority on both ends (an owner, or — via Cozystack nested tenancy — a parent
# tenant admin reaching into a subtenant namespace). Genuine cross-tenant
# connectivity is a future VPCPeering primitive, not a binding.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cozyplane-vpcbinding-export
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["sdn.cozystack.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["vpcbindings"]
  variables:
    - name: ref
      expression: object.spec.vpcRef
    # Only unrelated metadata writes skip authorization. Forwarding changes and
    # removing the reap finalizer can widen or retain access to another VPC.
    - name: grantUnchanged
      expression: >-
        oldObject != null &&
        oldObject.spec == object.spec &&
        (!has(oldObject.metadata.finalizers) ||
         !oldObject.metadata.finalizers.exists(f, f == 'sdn.cozystack.io/reap-ports') ||
         (has(object.metadata.finalizers) &&
          object.metadata.finalizers.exists(f, f == 'sdn.cozystack.io/reap-ports')))
  validations:
    - expression: oldObject == null || object.spec.vpcRef == oldObject.spec.vpcRef
      reason: Invalid
      message: "spec.vpcRef is immutable; delete and recreate the binding"
    # The request's user must be allowed to `export` the referenced VPC, in the
    # VPC's own (owner) namespace. RBAC verbs `["*"]` match the custom `export`
    # verb, so cluster-admins and full namespace-admins pass automatically.
    - expression: >-
        variables.grantUnchanged ||
        authorizer.group('sdn.cozystack.io').resource('vpcs')
          .namespace(variables.ref.namespace).name(variables.ref.name)
          .check('export').allowed()
      reason: Forbidden
      messageExpression: >-
        "creating or changing a VPCBinding grant to VPC " + variables.ref.namespace + "/" +
        variables.ref.name + " requires the 'export' verb on that VPC " +
        "(sdn.cozystack.io vpcs)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cozyplane-vpcbinding-export
spec:
  policyName: cozyplane-vpcbinding-export
  validationActions: ["Deny"]
---
# Gate VPCPeering creation on the `peer` verb of the LOCAL VPC (spec.vpcRef,
# which lives in the peering's own namespace). Verbs on a VPC express what a
# principal may do with it: `export` = grant use, `peer` = connect it to
# another VPC. Consent from the remote side stays the reciprocal half — no
# verb is checked on the peer VPC. Spec is immutable (strategy-enforced), so
# only CREATE needs the check; the refUnchanged guard keeps status/finalizer
# UPDATEs unblocked. In aggregated-apiserver mode the same check runs in the
# vpcpeering create strategy (admission does not see aggregated resources).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cozyplane-vpcpeering-peer
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["sdn.cozystack.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["vpcpeerings"]
  variables:
    - name: refUnchanged
      expression: >-
        oldObject != null &&
        oldObject.spec.vpcRef.name == object.spec.vpcRef.name
  validations:
    - expression: >-
        variables.refUnchanged ||
        authorizer.group('sdn.cozystack.io').resource('vpcs')
          .namespace(object.metadata.namespace).name(object.spec.vpcRef.name)
          .check('peer').allowed()
      reason: Forbidden
      messageExpression: >-
        "creating a VPCPeering for VPC " + object.metadata.namespace + "/" +
        object.spec.vpcRef.name + " requires the 'peer' verb on that VPC " +
        "(sdn.cozystack.io vpcs)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cozyplane-vpcpeering-peer
spec:
  policyName: cozyplane-vpcpeering-peer
  validationActions: ["Deny"]
---
