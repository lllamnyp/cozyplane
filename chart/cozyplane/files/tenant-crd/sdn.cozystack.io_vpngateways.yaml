---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: vpngateways.sdn.cozystack.io
spec:
  group: sdn.cozystack.io
  names:
    kind: VPNGateway
    listKind: VPNGatewayList
    plural: vpngateways
    singular: vpngateway
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpcRef.name
      name: VPC
      type: string
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VPNGateway is a managed tunnel endpoint for a VPC (issue #6): the controller
          runs the tunnel-termination appliance, gives it a FloatingIP endpoint, grants
          its Port the scoped forwarding right, and routes the connections' remote
          CIDRs to it. The crypto lives in the appliance's netns; cozyplane provides
          identity, delivery, routing, policy and metering around it (docs/vpn.md §3.2).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'VPNGatewaySpec declares a managed tunnel endpoint for a
              VPC (issue #6).'
            properties:
              additionalVPCRefs:
                description: |-
                  AdditionalVPCRefs are further VPCs this gateway serves (hub, docs/vpn.md
                  §3.3): every connection's remoteCIDRs are routed into each of them, and
                  each of them reaches every connection's remote sites. Same namespace as the
                  gateway. Served VPCs' CIDRs must be pairwise disjoint. Forbidden with
                  ha.mode=LiveMigration.
                items:
                  description: LocalVPCRef references a VPC in the same namespace
                    as the referring object.
                  properties:
                    name:
                      description: Name is the VPC name within the referring object's
                        namespace.
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 9
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              externalAddress:
                description: ExternalAddress is the public endpoint a remote peer
                  dials.
                properties:
                  addressClaimName:
                    description: |-
                      AddressClaimName names an IPAddressClaim reservation whose address the
                      endpoint should wear. Reserving it matters for IPsec, whose remote peer
                      pins the endpoint address (docs/vpn.md §3.2). Empty means dynamic.
                    type: string
                  addressClaimNames:
                    description: |-
                      AddressClaimNames reserves one stable endpoint per active-active appliance.
                      It must contain exactly two distinct names in ActiveActive mode.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  loadBalancerClass:
                    description: |-
                      LoadBalancerClass selects which LB implementation allocates and attracts
                      the endpoint address. Empty uses the cluster default.
                    type: string
                type: object
              ha:
                description: |-
                  HA selects an explicit availability tier. When absent,
                  highAvailability=true retains the legacy WarmStandby behavior.
                properties:
                  activeActive:
                    description: ActiveActive is required with mode ActiveActive.
                    properties:
                      bfd:
                        description: BFD enables fast failure detection for every
                          neighbor.
                        type: boolean
                      localASN:
                        description: LocalASN is the private or public ASN advertised
                          by both appliances.
                        format: int64
                        type: integer
                      peerASN:
                        description: PeerASN is the remote router's ASN.
                        format: int64
                        type: integer
                      peerAddresses:
                        description: PeerAddresses are BGP neighbor addresses reachable
                          through the tunnels.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                    required:
                    - localASN
                    - peerASN
                    - peerAddresses
                    type: object
                  mode:
                    description: VPNGatewayHAMode selects the failure model of the
                      managed appliance.
                    type: string
                  virtualMachine:
                    description: VirtualMachine is required with mode LiveMigration.
                    properties:
                      cloudInitSecretRef:
                        description: |-
                          CloudInitSecretRef optionally names operator-managed user data. Empty uses
                          controller-generated cloud-init containing the current tunnel config.
                        type: string
                      image:
                        type: string
                      stateClaimName:
                        description: StateClaimName is an existing RWX PVC used by
                          both migration endpoints.
                        type: string
                    required:
                    - image
                    - stateClaimName
                    type: object
                required:
                - mode
                type: object
              highAvailability:
                description: |-
                  HighAvailability runs the tunnel appliance as a warm standby pair on
                  distinct nodes (anti-affinity, same identity) instead of a single replica
                  (docs/vpn.md §3.5, tier 2). A node loss then costs one handshake, not a
                  reschedule: the controller's oldest-wins Port resolution re-targets the
                  FloatingIP and the route to the survivor. The crash-zero-drop tier
                  (dual-tunnel + BGP) is a later increment.
                type: boolean
              ipsec:
                description: |-
                  IPsec configures an IKEv2/strongSwan endpoint — the enterprise-interop
                  backend (issue #6). Exactly one of WireGuard or IPsec is set.
                properties:
                  addressPools:
                    description: |-
                      AddressPools are non-overlapping virtual-IP pools available to roadwarrior
                      connections. A connection selects one by name.
                    items:
                      description: |-
                        VPNIPsecAddressPool is a strongSwan-managed virtual-IP pool. Leases are
                        identity-bound by strongSwan and disappear when the corresponding
                        VPNConnection credential is revoked.
                      properties:
                        cidr:
                          description: CIDR is the address range allocated to clients
                            and routed to the appliance.
                          type: string
                        dns:
                          description: DNS lists optional DNS servers pushed to clients.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        name:
                          description: Name is unique within the gateway.
                          type: string
                      required:
                      - cidr
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  credentialSecretRef:
                    description: |-
                      CredentialSecretRef names a cert-manager-compatible TLS Secret containing
                      tls.crt and tls.key. ca.crt in the same Secret is accepted as the trust
                      anchor when TrustedCASecretRef is empty.
                    type: string
                  localIdentity:
                    description: |-
                      LocalIdentity is the IKE identity presented by the gateway. Empty lets
                      strongSwan derive it from the selected certificate.
                    type: string
                  proposals:
                    description: |-
                      Proposals are the default IKE/ESP proposals for connections that do not set
                      their own (strongSwan proposal syntax, e.g. "aes256-sha256-modp2048").
                      Empty lets charon negotiate its defaults.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  trustedCASecretRef:
                    description: |-
                      TrustedCASecretRef names a Secret containing ca.crt used to authenticate
                      certificate-based remote peers.
                    type: string
                type: object
              vpcRef:
                description: |-
                  VPCRef is the VPC this gateway terminates tunnels into, in this namespace.
                  It is the PRIMARY served VPC: the appliance's default route, its endpoint
                  FloatingIP and the tunnel MTU budget all belong to it.
                properties:
                  name:
                    description: Name is the VPC name within the referring object's
                      namespace.
                    type: string
                required:
                - name
                type: object
              wireguard:
                description: |-
                  WireGuard configures a WireGuard endpoint. Exactly one tunnel backend is
                  set per gateway.
                properties:
                  addressPools:
                    description: AddressPools select a dedicated workstation gateway
                      when nonempty.
                    items:
                      description: VPNWireGuardAddressPool is a persistent address
                        pool for workstation clients.
                      properties:
                        cidr:
                          type: string
                        dns:
                          description: DNS lists optional resolver addresses included
                            in client configuration.
                          items:
                            type: string
                          maxItems: 16
                          type: array
                          x-kubernetes-list-type: atomic
                        name:
                          type: string
                      required:
                      - cidr
                      - name
                      type: object
                    maxItems: 128
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  listenPort:
                    description: |-
                      ListenPort is the UDP port the WireGuard endpoint listens on. Zero lets
                      the appliance pick the default.
                    format: int32
                    type: integer
                type: object
            required:
            - vpcRef
            type: object
          status:
            description: VPNGatewayStatus is the observed state of a VPNGateway.
            properties:
              address:
                description: |-
                  Address is the assigned external endpoint address — what a tenant reads
                  out to configure the remote peer.
                type: string
              addresses:
                description: |-
                  Addresses are all active public endpoints. Address remains the first entry
                  for compatibility with single-endpoint clients.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              appliancePort:
                description: |-
                  AppliancePort is the cluster-scoped Port name of the tunnel appliance's
                  leg in the VPC — the next-hop the connections' routes resolve to.
                type: string
              appliancePorts:
                description: |-
                  AppliancePorts are all ready route next-hops. AppliancePort remains the
                  first entry for compatibility.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: Conditions is the detailed state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              phase:
                description: Phase is the lifecycle phase.
                type: string
              publicKey:
                description: |-
                  PublicKey is the WireGuard public key of this gateway's endpoint, which the
                  tenant configures the remote peer with. The private key stays in a Secret
                  the appliance mounts; only the public half is surfaced.
                type: string
              publicKeys:
                description: |-
                  PublicKeys are the WireGuard identities of all active-active endpoints.
                  PublicKey remains the first entry for compatibility.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              routes:
                description: |-
                  Routes reports the connections' remote CIDRs and the Port they are
                  programmed toward, merged into the VPC route table by the agent (the same
                  shape VPCGateway.status.routes uses).
                items:
                  description: VPCGatewayRouteStatus reports one resolved route.
                  properties:
                    cidrs:
                      description: CIDRs echoes the spec route's prefixes.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    port:
                      description: |-
                        Port is the cluster-scoped Port name the CIDRs were programmed toward,
                        empty when the route did not resolve (no live selected Port, or the
                        selected Port's binding lacks allowForwarding).
                      type: string
                    ports:
                      description: |-
                        Ports are ECMP next-hops for this prefix. Port remains the first entry for
                        additive compatibility with single-next-hop agents.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    vpcRef:
                      description: |-
                        VPCRef scopes a VPN route to a declared same-namespace served VPC.
                        Empty means the parent gateway's primary VPC. VPCGateway ignores it.
                      properties:
                        name:
                          description: Name is the VPC name within the referring object's
                            namespace.
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - cidrs
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
