---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: vpcs.sdn.cozystack.io
spec:
  group: sdn.cozystack.io
  names:
    kind: VPC
    listKind: VPCList
    plural: vpcs
    singular: vpc
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.vni
      name: VNI
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VPC is a tenant overlay network. It is namespaced: the namespace expresses
          ownership. A pod's *use* of a VPC is granted separately by a VPCBinding, even
          within the owner's own namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VPCSpec is the specification of a VPC — a tenant overlay
              network.
            properties:
              boundary:
                description: |-
                  Boundary is an operator-managed ceiling, independent of tenant groups.
                  Setting, changing or removing it requires manage-boundary on this VPC.
                properties:
                  internet:
                    type: boolean
                  peers:
                    items:
                      description: VPCBoundaryRule admits an initiation; tracked replies
                        require no reverse grant.
                      properties:
                        direction:
                          description: Direction is ingress or egress, relative to
                            this VPC.
                          type: string
                        icmpCode:
                          format: int32
                          type: integer
                        icmpType:
                          format: int32
                          type: integer
                        peerRef:
                          description: |-
                            VPCRef references a VPC by namespace and name. The namespace is the VPC
                            owner's namespace, not necessarily the referrer's.
                          properties:
                            name:
                              description: Name is the VPC name within that namespace.
                              type: string
                            namespace:
                              description: |-
                                Namespace is the namespace that owns the VPC.
                                Omitted namespace resolves locally for namespaced binding consumers.
                              type: string
                          required:
                          - name
                          type: object
                        ports:
                          items:
                            format: int32
                            type: integer
                          type: array
                          x-kubernetes-list-type: atomic
                        protocol:
                          description: Protocol is TCP, UDP or ICMP (family follows
                            the packet).
                          type: string
                      required:
                      - direction
                      - peerRef
                      - protocol
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  revision:
                    description: Revision is positive and increases whenever the policy
                      changes.
                    format: int64
                    type: integer
                required:
                - internet
                - revision
                type: object
              cidrs:
                description: |-
                  CIDRs are the address ranges (IPv4 and/or IPv6) of the VPC. These may
                  overlap with other VPCs; isolation is by overlay, not address space.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              mtu:
                description: |-
                  MTU is the MTU advertised to ports in this VPC. Zero selects the
                  controller default.
                format: int32
                type: integer
            type: object
          status:
            description: VPCStatus is the observed state of a VPC.
            properties:
              boundaryNodes:
                description: BoundaryNodes acknowledges the revision loaded by each
                  agent instance.
                items:
                  description: VPCBoundaryNode is an agent instance's successful dataplane
                    acknowledgement.
                  properties:
                    agentUID:
                      type: string
                    node:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    primaryPortsDigest:
                      type: string
                    revision:
                      format: int64
                      type: integer
                    transportReady:
                      description: TransportReady confirms that peer maps and routes
                        are synchronized.
                      type: boolean
                  required:
                  - agentUID
                  - node
                  - observedGeneration
                  - primaryPortsDigest
                  - revision
                  - transportReady
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - node
                x-kubernetes-list-type: map
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              phase:
                description: Phase is the current lifecycle phase of the VPC.
                enum:
                - Pending
                - Ready
                type: string
              vni:
                description: |-
                  VNI is the overlay network identifier allocated to this VPC by the
                  controller. Zero means unallocated.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
