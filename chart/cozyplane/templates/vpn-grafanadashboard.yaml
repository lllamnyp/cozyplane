{{- if and .Values.vpn.observability.dashboard.enabled (.Capabilities.APIVersions.Has "grafana.integreatly.org/v1beta1/GrafanaDashboard") }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cozyplane-vpn
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cozyplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: vpn
spec:
  instanceSelector:
    {{- toYaml .Values.vpn.observability.dashboard.instanceSelector | nindent 4 }}
  json: |-
    {
      "title": "Cozyplane VPN",
      "uid": "cozyplane-vpn",
      "tags": ["cozyplane", "vpn"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "templating": {
        "list": [
          {"name":"namespace","label":"Namespace","type":"query","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"definition":"label_values(cozyplane_vpn_connection_last_handshake_timestamp_seconds, namespace)","query":{"query":"label_values(cozyplane_vpn_connection_last_handshake_timestamp_seconds, namespace)","refId":"Namespace"},"includeAll":true,"allValue":".*","multi":true,"current":{"text":"All","value":"$__all"}},
          {"name":"gateway","label":"Gateway","type":"query","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"definition":"label_values(cozyplane_vpn_connection_last_handshake_timestamp_seconds{namespace=~\"$namespace\"}, gateway)","query":{"query":"label_values(cozyplane_vpn_connection_last_handshake_timestamp_seconds{namespace=~\"$namespace\"}, gateway)","refId":"Gateway"},"includeAll":true,"allValue":".*","multi":true,"current":{"text":"All","value":"$__all"}},
          {"name":"connection","label":"Connection","type":"query","datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"definition":"label_values(cozyplane_vpn_connection_last_handshake_timestamp_seconds{namespace=~\"$namespace\",gateway=~\"$gateway\"}, connection)","query":{"query":"label_values(cozyplane_vpn_connection_last_handshake_timestamp_seconds{namespace=~\"$namespace\",gateway=~\"$gateway\"}, connection)","refId":"Connection"},"includeAll":true,"allValue":".*","multi":true,"current":{"text":"All","value":"$__all"}}
        ]
      },
      "panels": [
        {"id":1,"title":"Connection state","type":"stat","gridPos":{"h":8,"w":8,"x":0,"y":0},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"expr":"max without (backend, pod) (cozyplane_vpn_connection_up{namespace=~\"$namespace\",gateway=~\"$gateway\",connection=~\"$connection\"})","refId":"A"}],"fieldConfig":{"defaults":{"mappings":[{"type":"value","options":{"0":{"text":"Down","color":"red"},"1":{"text":"Up","color":"green"}}}],"thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}},"overrides":[]}},
        {"id":2,"title":"Handshake age","type":"timeseries","gridPos":{"h":8,"w":16,"x":8,"y":0},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"expr":"time() - max without (backend, pod) (cozyplane_vpn_connection_last_handshake_timestamp_seconds{namespace=~\"$namespace\",gateway=~\"$gateway\",connection=~\"$connection\"})","legendFormat":"{{ "{{" }}connection{{ "}}" }}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"s","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":300},{"color":"red","value":600}]}},"overrides":[]}},
        {"id":3,"title":"Traffic rate","type":"timeseries","gridPos":{"h":9,"w":12,"x":0,"y":8},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"expr":"sum without (backend, pod) (rate(cozyplane_vpn_connection_rx_bytes_total{namespace=~\"$namespace\",gateway=~\"$gateway\",connection=~\"$connection\"}[$__rate_interval]))","legendFormat":"{{ "{{" }}connection{{ "}}" }} rx","refId":"A"},{"expr":"sum without (backend, pod) (rate(cozyplane_vpn_connection_tx_bytes_total{namespace=~\"$namespace\",gateway=~\"$gateway\",connection=~\"$connection\"}[$__rate_interval]))","legendFormat":"{{ "{{" }}connection{{ "}}" }} tx","refId":"B"}],"fieldConfig":{"defaults":{"unit":"Bps"},"overrides":[]}},
        {"id":4,"title":"IPsec packet rate","type":"timeseries","gridPos":{"h":9,"w":12,"x":12,"y":8},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"expr":"sum without (backend, pod) (rate(cozyplane_vpn_connection_rx_packets_total{namespace=~\"$namespace\",gateway=~\"$gateway\",connection=~\"$connection\"}[$__rate_interval]))","legendFormat":"{{ "{{" }}connection{{ "}}" }} rx","refId":"A"},{"expr":"sum without (backend, pod) (rate(cozyplane_vpn_connection_tx_packets_total{namespace=~\"$namespace\",gateway=~\"$gateway\",connection=~\"$connection\"}[$__rate_interval]))","legendFormat":"{{ "{{" }}connection{{ "}}" }} tx","refId":"B"}],"fieldConfig":{"defaults":{"unit":"pps"},"overrides":[]}},
        {"id":5,"title":"Appliance restarts","type":"timeseries","gridPos":{"h":8,"w":24,"x":0,"y":17},"datasource":{"type":"prometheus","uid":"${DS_PROMETHEUS}"},"targets":[{"expr":"sum by (namespace, gateway, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\",container=\"vpn-gateway\"}[5m]))","legendFormat":"{{ "{{" }}gateway{{ "}}" }}/{{ "{{" }}pod{{ "}}" }}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]}}
      ]
    }
{{- end }}
