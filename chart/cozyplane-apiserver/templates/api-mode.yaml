{{- if not (has .Values.api.mode (list "aggregated" "crd")) -}}
{{- fail "api.mode must be aggregated or crd" -}}
{{- end -}}
{{- $mode := lookup "v1" "ConfigMap" .Release.Namespace "cozyplane-api-mode" -}}
{{- if and $mode (ne (index $mode.data "mode") .Values.api.mode) -}}
{{- fail "control-plane api.mode must match the CNI distribution; use a fresh regional cluster" -}}
{{- end -}}
{{- if eq .Values.api.mode "aggregated" -}}
{{- range $resource := list "vpcs" "vpcbindings" "vpcpeerings" "vpcgateways" "ports" "floatingips" "servicevips" "securitygroups" "hostfirewalls" "vpngateways" "vpnconnections" -}}
{{- if lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" (printf "%s.sdn.cozystack.io" $resource) -}}
{{- fail "aggregated apiserver cannot coexist with tenant CRDs; use a fresh regional cluster" -}}
{{- end -}}
{{- end -}}
{{- end -}}
