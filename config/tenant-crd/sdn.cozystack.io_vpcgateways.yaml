---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: vpcgateways.sdn.cozystack.io
spec:
  group: sdn.cozystack.io
  names:
    kind: VPCGateway
    listKind: VPCGatewayList
    plural: vpcgateways
    singular: vpcgateway
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpcRef.name
      name: VPC
      type: string
    - jsonPath: .spec.nat.enabled
      name: NAT
      type: boolean
    - jsonPath: .status.natAddress
      name: NATAddress
      type: string
    - jsonPath: .spec.ingress.loadBalancer
      name: LB
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VPCGateway is a VPC's north-south boundary: the one place where its traffic to
          and from the outside world is declared, permitted and counted
          (docs/north-south.md).

          It is a boundary, not a hop. Packets are not detoured through it —
          enforcement stays in the datapath's eBPF hooks, exactly where it already is.
          What the gateway does is give that enforcement an owner: without one, a VPC has
          no way out (no NAT egress) and no way in (no LoadBalancer ingress), and the
          bytes that cross have nothing to be attributed to.

          A VPC has exactly one. Creating a gateway is the tenant's act; who may mint the
          public address it draws is Service RBAC + the allocator's own scoping
          (docs/external-addresses.md §8).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VPCGatewaySpec declares a VPC's north-south boundary.
            properties:
              appliance:
                description: |-
                  Appliance names a workload of the tenant's own that IS this VPC's door —
                  a firewall or router attached to several VPCs (docs/multi-attach.md).

                  Off-VPC traffic from a VPC pod is delivered to gateways[vni] with its
                  original destination intact, so whatever holds that entry receives the
                  VPC's egress by construction and may route it on. Until now only
                  cozyplane's own gateway pod could hold it — claimed by addGatewayLeg,
                  restricted to the agent's namespace and to the VPC's reserved .1 — which
                  left no way to say "my appliance is the door".

                  Setting it does NOT give the appliance the right to emit a source it does
                  not own; that is the separate, export-gated VPCBinding.allowForwarding
                  grant. Being the door means receiving; forwarding means sending. A
                  firewall wants both, and they are granted by different people.

                  When set, the controller points the VPC's gateway at the selected
                  workload's Port in this VPC and spawns no gateway pod of its own.
                properties:
                  namespace:
                    description: |-
                      Namespace is where to look for it. Empty means the VPCGateway's own
                      namespace, which is the ordinary case — the appliance belongs to the
                      tenant that owns the VPC.
                    type: string
                  podSelector:
                    description: |-
                      PodSelector selects the appliance pod. A selector rather than a name
                      because the workload is normally a Deployment or a VM whose pod name
                      changes underneath it; the door must survive that.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - podSelector
                type: object
              ingress:
                description: Ingress configures what may enter the VPC from outside.
                properties:
                  loadBalancer:
                    description: |-
                      LoadBalancer admits Service type=LoadBalancer traffic onto this VPC's
                      pods. It is FALSE by default, and that default is the point: without a
                      gateway saying otherwise, a Service created in any namespace cannot open a
                      door into a tenant's VPC. Ingress into a VPC is something the VPC's own
                      boundary admits (docs/north-south.md, tenet 7).

                      It admits the traffic to the boundary; the destination's SecurityGroups
                      still decide which pods and ports answer.
                    type: boolean
                type: object
              loadBalancerClass:
                description: |-
                  LoadBalancerClass selects which load-balancer implementation allocates and
                  attracts the VPC's NAT identity (Kubernetes' generic
                  `Service.spec.loadBalancerClass`). Empty uses the cluster's default. cozyplane
                  allocates nothing itself — the gateway owns a `Service type: LoadBalancer` per
                  address family and consumes the address that implementation assigns
                  (docs/external-addresses.md §5).
                type: string
              nat:
                description: NAT configures many-to-one egress.
                properties:
                  addressClaimName:
                    description: |-
                      AddressClaimName / AddressClaimName6 name single-family IPAddressClaims
                      (local.sdn.cozystack.io, the address-controller) in this namespace whose
                      reserved addresses the VPC's v4 / v6 egress should wear. One claim per
                      family, because association is one-claim-one-Service and the gateway owns
                      one single-family Service per family (docs/external-addresses.md §7).
                      cozyplane only copies each into the association annotation on that family's
                      owned Service; empty means dynamic (the LB implementation auto-assigns).
                    type: string
                  addressClaimName6:
                    type: string
                  enabled:
                    description: |-
                      Enabled opens outbound access for VPC pods that hold no floating address,
                      masqueraded to an address of the VPC's own.
                    type: boolean
                type: object
              routes:
                description: |-
                  Routes is the VPC's route table for off-VPC destinations (issue #6). Until
                  now a VPC had exactly two off-net dispositions: the default gateway
                  (NAT egress / internet) or drop. A route adds a third — "these remote
                  prefixes go through THIS workload" — and once there are three there is a
                  table, of which the NAT gateway is retroactively just the default entry.

                  Each route names remote CIDRs and the workload (an appliance leg in this
                  VPC — a VPN endpoint, a router) they resolve through, by identity. The
                  datapath consults it BEFORE the NAT decision, so a routed prefix reaches
                  the appliance instead of being masqueraded toward the internet; a miss
                  falls through to NAT/drop exactly as today. The workload may reschedule or
                  change IP and the route re-resolves — a route never names an address.

                  A route only delivers; the right of the target to forward a foreign
                  (remote-site) source is the separate VPCBinding.allowForwarding grant. A
                  route to a Port whose binding lacks that grant is inert, reported in a
                  condition, and widens nothing.
                items:
                  description: VPCGatewayRoute directs a set of off-VPC prefixes through
                    a named workload.
                  properties:
                    cidrs:
                      description: |-
                        CIDRs are the remote prefixes this route matches (v4 or v6). They must not
                        overlap the cluster's own networks (pod/service/node/join, link-local);
                        the controller refuses such a route in a condition.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    via:
                      description: Via selects the workload the matched traffic is
                        delivered to.
                      properties:
                        namespace:
                          description: |-
                            Namespace is where to look for it. Empty means the VPCGateway's own
                            namespace.
                          type: string
                        podSelector:
                          description: |-
                            PodSelector selects the next-hop pod (a Deployment or VM pod whose name
                            changes underneath it; a selector so the route survives that).
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                      required:
                      - podSelector
                      type: object
                  required:
                  - cidrs
                  - via
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              vpcRef:
                description: VPCRef is the VPC this gateway is the boundary of, in
                  this namespace.
                properties:
                  name:
                    description: Name is the VPC name within the referring object's
                      namespace.
                    type: string
                required:
                - name
                type: object
            required:
            - vpcRef
            type: object
          status:
            properties:
              appliancePort:
                description: |-
                  AppliancePort is the Port currently serving as the VPC's door when
                  spec.appliance is set — the cluster-scoped Port name, so an operator can
                  see WHICH leg of a multi-attached appliance was chosen. Empty when no
                  appliance is declared or none could be resolved.
                type: string
              conditions:
                description: Conditions is the detailed state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              natAddress:
                description: |-
                  NATAddress is the v4 address this VPC's v4 egress wears on the wire — read from
                  the gateway's owned v4 LoadBalancer Service (docs/external-addresses.md §5), and
                  the tenant's OWN identity. Without it a VPC's v4 traffic is SNATed to the node's
                  address and is indistinguishable from the platform's (docs/north-south.md, tenet
                  8). Empty means the VPC has no v4 CIDR, or the LB implementation assigned no v4
                  address; its v4 egress (if any) falls back to the pod.
                type: string
              natAddress6:
                description: |-
                  NATAddress6 is the v6 counterpart: the address this VPC's v6 egress wears
                  (docs/north-south.md §6a), read from the gateway's owned v6 LoadBalancer Service.
                  Each family gets its own eBPF identity when the LB implementation can assign one;
                  a family with none keeps the gateway pod. The pod is retired only once every
                  family the VPC has is served in eBPF.
                type: string
              phase:
                description: Phase is the lifecycle phase.
                type: string
              routes:
                description: |-
                  Routes reports how each spec.routes entry resolved: the CIDRs it matched
                  and the cluster-scoped Port name they were programmed toward, so an
                  operator sees which leg a route landed on (and, when empty, that it did
                  not resolve — the RoutesResolved condition carries why).
                items:
                  description: VPCGatewayRouteStatus reports one resolved route.
                  properties:
                    cidrs:
                      description: CIDRs echoes the spec route's prefixes.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    port:
                      description: |-
                        Port is the cluster-scoped Port name the CIDRs were programmed toward,
                        empty when the route did not resolve (no live selected Port, or the
                        selected Port's binding lacks allowForwarding).
                      type: string
                    ports:
                      description: |-
                        Ports are ECMP next-hops for this prefix. Port remains the first entry for
                        additive compatibility with single-next-hop agents.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    vpcRef:
                      description: |-
                        VPCRef scopes a VPN route to a declared same-namespace served VPC.
                        Empty means the parent gateway's primary VPC. VPCGateway ignores it.
                      properties:
                        name:
                          description: Name is the VPC name within the referring object's
                            namespace.
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - cidrs
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
